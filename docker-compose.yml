services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "_q98g%-U2A.{i|CNdt'[(<rz@l"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  krakend:
    build: ./gateway
    command: ["run", "-d", "-c", "/etc/krakend/krakend.json"]
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
  api:
    build: ./services/api
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: eig
      DB_USER: sa
      DB_PASSWORD: "_q98g%-U2A.{i|CNdt'[(<rz@l"
      DB_ENCRYPT: "true"
      DB_TRUST_CERT: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "3000:3000"
