name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  MSSQL_SA_PASSWORD: "_q98g%-U2A.{i|CNdt'[(<rz@l"

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
          MSSQL_PID: "Developer"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${{ env.MSSQL_SA_PASSWORD }}\" -No -Q \"SELECT 1\" || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "1433"
      DB_NAME: eig
      DB_USER: sa
      DB_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
      DB_ENCRYPT: "true"
      DB_TRUST_CERT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install
        working-directory: services/api
        run: npm ci

      - name: Lint
        working-directory: services/api
        run: npm run lint

      - name: Apply migration
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DB_PASSWORD" -No \
            -i services/api/src/db/migrations/001_init.sql

      - name: Unit tests
        working-directory: services/api
        run: npm test

      - name: Start API
        working-directory: services/api
        run: node src/server.js &
        env:
          PORT: "3000"

      - name: Wait for API
        run: |
          for i in $(seq 1 20); do 
            curl -sf http://localhost:3000/health && break || sleep 2;
          done

      - name: Newman (API-direct smoke)
        run: |
          npm install -g newman 
          newman run test/postman/integration.postman_collection.json \
            --env-var "gateway=http://localhost:3000"
